# 由 githup App 生成（Android Gradle）· 2026-11-16
# 修改说明：修复构建失败——补装 Android SDK、Gradle 分发源换官方（华为云镜像海外不可达）、
#           versionCode 默认值改为整数、未配置签名密钥时跳过签名（构建仍成功）。
# 每个步骤都带注释，可直接修改；改完请在上方填写修改说明再保存。

name: Build APK

on:
  workflow_dispatch:   # 允许在 App 里点「手动触发构建」
    inputs:
      app_name:
        description: 安装包名称
        default: '小布输入法修改上滑符号'
      version_name:
        description: 版本号（versionName）
        default: '1.2'
      version_code:
        description: 版本代号（versionCode，整数）
        default: '3'

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub 免费提供的 Linux 构建机
    steps:
      # 1. 把仓库代码拉到构建机上
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 准备 JDK（AGP 8.8 需要 17 及以上）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Android SDK（compileSdk 35 + build-tools 35.0.0，与项目一致）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      # 4. gradlew 必须可执行，否则报 Permission denied
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      # 5. gradle-wrapper.properties 指向华为云镜像，海外构建机访问不可靠，换成官方源
      - name: Use official Gradle distribution
        run: |
          sed -i 's#mirrors.huaweicloud.com/gradle/#services.gradle.org/distributions/#g' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # 6. 改成你在 App 里填的版本号（同时兼容 build.gradle 与 .kts）
      - name: Set version
        env:
          VN: ${{ github.event.inputs.version_name }}
          VC: ${{ github.event.inputs.version_code }}
        run: |
          for f in $(find . -name "build.gradle" -o -name "build.gradle.kts"); do
            sed -i -E "s/versionName.*/versionName = \"$VN\"/" "$f"
            sed -i -E "s/versionCode.*/versionCode = $VC/" "$f"
          done
          echo "版本已设为 $VN ($VC)"

      # 7. 构建；命令可以按需改，例如只编某个模块 :app:assembleDebug
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      # 8. 签名：Base64 还原成 keystore，再用 apksigner 给 APK 签名。
      #    未在仓库 Secrets 配置 KEYSTORE_BASE64 时跳过本步，产物为未签名 APK（构建仍成功）。
      - name: Sign APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/app.keystore
          APK=$(find . -name "*.apk" -path "*/outputs/apk/release/*" | head -1)
          if [ -z "$APK" ]; then echo "没有找到 APK"; exit 1; fi
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | head -1)
          "$SIGNER" sign --ks /tmp/app.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
      - name: Skip signing (no keystore configured)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: echo "未配置签名密钥，产物为未签名 APK"

      # 9. 把产物改成你指定的安装包名称
      - name: Rename APK
        env:
          NAME: ${{ github.event.inputs.app_name }}
          VN: ${{ github.event.inputs.version_name }}
        run: |
          APK=$(find . -name "*.apk" -path "*/outputs/apk/release/*" | head -1)
          if [ -n "$APK" ]; then
            D=$(dirname "$APK")
            mv "$APK" "$D/$NAME-$VN.apk"
            echo "产物: $D/$NAME-$VN.apk"
          fi

      # 10. 上传产物：构建完后在 App 里点开这条运行记录即可下载、自动安装
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.version_name }}
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error
