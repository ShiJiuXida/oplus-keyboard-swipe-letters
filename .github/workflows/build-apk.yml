# 由 githup App 生成（Android Gradle）· 2026-11-16
# 修改说明：构建 debug APK 并打包 zip（zip 内直接放 APK，不嵌套目录）；
#          补装 Android SDK、Gradle 分发源换官方（华为云镜像海外不可达）、versionCode 默认值为整数。
# 每个步骤都带注释，可直接修改；改完请在上方填写修改说明再保存。

name: Build Debug APK

on:
  workflow_dispatch:   # 允许在 App 里点「手动触发构建」
    inputs:
      app_name:
        description: 安装包名称
        default: '小布26键上滑字母'
      version_name:
        description: 版本号（versionName）
        default: '1.5'
      version_code:
        description: 版本代号（versionCode，整数）
        default: '6'

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub 免费提供的 Linux 构建机
    steps:
      # 1. 把仓库代码拉到构建机上
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 准备 JDK（AGP 8.8 需要 17 及以上）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Android SDK（compileSdk 35 + build-tools 35.0.0，与项目一致）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      # 4. gradlew 必须可执行，否则报 Permission denied
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      # 5. gradle-wrapper.properties 指向华为云镜像，海外构建机访问不可靠，换成官方源
      - name: Use official Gradle distribution
        run: |
          sed -i 's#mirrors.huaweicloud.com/gradle/#services.gradle.org/distributions/#g' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # 6. 改成你在 App 里填的版本号（同时兼容 build.gradle 与 .kts）
      - name: Set version
        env:
          VN: ${{ github.event.inputs.version_name }}
          VC: ${{ github.event.inputs.version_code }}
        run: |
          for f in $(find . -name "build.gradle" -o -name "build.gradle.kts"); do
            sed -i -E "s/versionName.*/versionName = \"$VN\"/" "$f"
            sed -i -E "s/versionCode.*/versionCode = $VC/" "$f"
          done
          echo "版本已设为 $VN ($VC)"

      # 7. 构建 debug APK（自带 debug 签名，可直接安装测试）
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 8. 打包 zip：在产物目录内打包，zip 内直接是 APK 文件，不嵌套目录
      - name: Package APK into zip
        env:
          NAME: ${{ github.event.inputs.app_name }}
          VN: ${{ github.event.inputs.version_name }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "没有找到 APK"; exit 1; fi
          cd app/build/outputs/apk/debug
          ZIP_NAME="$NAME-$VN-debug.zip"
          zip -j "$ZIP_NAME" "$(basename "$APK")"
          echo "产物: app/build/outputs/apk/debug/$ZIP_NAME"
          ls -la

      # 9. 上传产物：构建完后在 App 里点开这条运行记录即可下载、自动安装
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.version_name }}-debug
          path: |
            **/build/outputs/apk/debug/*.zip
          if-no-files-found: error
